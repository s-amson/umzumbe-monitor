<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fa">
<title>UEM Sign In</title>
<style>
:root{--bg:#f4f7fa;--surface:#fff;--text:#111820;--muted:#7a838d;--border:#dfe5ea;--blue:#1599ee;--blue-dark:#087ac1;--blue-soft:#eaf6fe;--danger:#c93842;--danger-soft:#fff0f1;--shadow:0 24px 70px rgba(25,40,55,.12)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#fff 0,var(--bg) 58%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit}
[hidden]{display:none!important}
.signin-card{width:min(100%,500px);background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:clamp(30px,7vw,48px);box-shadow:var(--shadow)}
.brand{text-align:center;margin-bottom:38px}
.brand-mark{font-size:clamp(64px,17vw,92px);line-height:.88;font-weight:950;letter-spacing:-6px;color:var(--text)}
.brand-name{margin:14px 0 0;color:var(--muted);font-size:13px;letter-spacing:.2px}
.panel-heading{text-align:center;margin-bottom:19px}
.panel-heading h1{font-size:21px;margin:0 0 7px;letter-spacing:-.35px}
.panel-heading p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.role-options{display:grid;gap:12px}
.role-button{width:100%;display:grid;grid-template-columns:48px 1fr 24px;align-items:center;gap:14px;text-align:left;border:1px solid var(--border);border-radius:17px;padding:15px;background:var(--surface);cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
.role-button:hover,.role-button:focus-visible{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 24px rgba(21,153,238,.12);outline:none}
.role-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-dark)}
.role-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.role-title{display:block;font-size:16px;font-weight:850;margin-bottom:3px}.role-description{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.role-arrow{color:var(--muted);font-size:23px;line-height:1;text-align:center}
.official-panel{animation:panelIn .2s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin:0 0 7px}.field input{width:100%;border:1px solid var(--border);border-radius:13px;background:#f8fafc;color:var(--text);padding:13px 14px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.error-message{display:none;color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 38%,var(--border));border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.4;margin:2px 0 14px}.error-message.show{display:block}
.primary-button{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:13px 16px;font-weight:850;cursor:pointer}.primary-button:hover{background:var(--blue-dark)}
.back-button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px;margin-top:7px;font-size:13px;font-weight:750;cursor:pointer}.back-button:hover{color:var(--text)}
@media(max-width:520px){body{padding:16px}.signin-card{border-radius:24px;padding:30px 21px}.brand{margin-bottom:32px}.brand-mark{letter-spacing:-4px}}
</style>
</head>
<body>
<main class="signin-card" aria-labelledby="pageTitle">
  <header class="brand">
    <div class="brand-mark">UEM</div>
    <p class="brand-name">UmZumbe Enviromental Monitor</p>
  </header>

  <section id="rolePanel">
    <div class="panel-heading"><h1 id="pageTitle">Sign in</h1><p>Choose how you want to continue.</p></div>
    <div class="role-options">
      <button class="role-button" id="residentButton" type="button">
        <span class="role-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></span>
        <span><span class="role-title">Resident</span><span class="role-description">Continue to the community dashboard</span></span>
        <span class="role-arrow" aria-hidden="true">›</span>
      </button>
      <button class="role-button" id="officialButton" type="button">
        <span class="role-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 7.8 7.5 9.5 4.4-1.7 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="M9 11h6v5H9zM10 11V9a2 2 0 0 1 4 0v2"/></svg></span>
        <span><span class="role-title">Official</span><span class="role-description">Sign in with your username and PIN</span></span>
        <span class="role-arrow" aria-hidden="true">›</span>
      </button>
    </div>
  </section>

  <section class="official-panel" id="officialPanel" hidden>
    <div class="panel-heading"><h1>Official sign in</h1><p>Enter your official access details.</p></div>
    <form id="officialForm" novalidate>
      <div class="field"><label for="officialUsername">Username</label><input id="officialUsername" name="username" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="officialPin">PIN</label><input id="officialPin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></div>
      <div class="error-message" id="loginError" role="alert">Incorrect username or PIN. Please try again.</div>
      <button class="primary-button" type="submit">Sign in</button>
      <button class="back-button" id="backButton" type="button">Back to sign-in options</button>
    </form>
  </section>
</main>

<script>
const rolePanel=document.getElementById("rolePanel"),officialPanel=document.getElementById("officialPanel"),residentButton=document.getElementById("residentButton"),officialButton=document.getElementById("officialButton"),officialForm=document.getElementById("officialForm"),officialUsername=document.getElementById("officialUsername"),officialPin=document.getElementById("officialPin"),loginError=document.getElementById("loginError"),backButton=document.getElementById("backButton");
residentButton.addEventListener("click",()=>{location.href="dashboard.html"});
officialButton.addEventListener("click",()=>{rolePanel.hidden=true;officialPanel.hidden=false;loginError.classList.remove("show");setTimeout(()=>officialUsername.focus(),50)});
backButton.addEventListener("click",()=>{officialPanel.hidden=true;rolePanel.hidden=false;officialForm.reset();loginError.classList.remove("show");officialButton.focus()});
officialForm.addEventListener("submit",event=>{event.preventDefault();const username=officialUsername.value.trim().toLowerCase(),pin=officialPin.value;if(username==="owner"&&pin==="0000"){sessionStorage.setItem("uem-official-auth","true");location.href="official.html";return}loginError.classList.add("show");officialPin.value="";officialPin.focus()});
[officialUsername,officialPin].forEach(input=>input.addEventListener("input",()=>loginError.classList.remove("show")));
</script>
</body>
</html>
