<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>UEM Sign In</title>
<style>
:root{--ink:#102f42;--text:#20262c;--muted:#9098a0;--line:#dfe4e8;--blue:#0b759f;--blue-dark:#074c70;--blue-soft:#e8f5fa;--danger:#c73e48;--danger-soft:#fff1f2;--shadow:0 12px 28px rgba(20,39,52,.14)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;background:#f6f8fa;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit}
[hidden]{display:none!important}
.welcome-screen{position:relative;width:min(100%,760px);min-height:100vh;margin:0 auto;overflow:hidden;background:#fff;box-shadow:0 0 44px rgba(20,39,52,.08)}
.hero{position:relative;min-height:clamp(390px,57vh,560px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(105px,17vh,165px) 24px 30px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0 0 18%;z-index:-3;background-image:linear-gradient(rgba(10,94,130,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(10,94,130,.055) 1px,transparent 1px);background-size:9px 9px;mask-image:linear-gradient(to bottom,#000,transparent 87%)}
.hero::after{content:"";position:absolute;z-index:-2;width:115%;height:230px;left:-7%;top:56px;border-radius:50%;background:rgba(255,255,255,.91);box-shadow:0 52px 75px rgba(255,255,255,.92)}
.decor-pill{position:absolute;top:31px;left:-35px;width:150px;height:43px;border-radius:0 24px 24px 0;background:rgba(12,103,142,.1)}
.decor-ring{position:absolute;right:-74px;top:42px;width:210px;height:105px;border:2px solid rgba(12,103,142,.08);border-radius:0 0 0 110px}
.greeting{position:relative;width:min(100%,560px);text-align:center}
.hello-word{position:absolute;color:#6d8795;font-size:clamp(18px,4vw,27px);font-weight:700;opacity:.16;z-index:-1;white-space:nowrap}.word-one{left:9%;top:-38px}.word-two{right:8%;top:-31px}.word-three{left:-1%;bottom:24px}.word-four{right:0;bottom:19px}
.uem{font-size:clamp(96px,25vw,170px);line-height:.84;font-weight:950;letter-spacing:-.09em;padding-right:.09em;color:transparent;background:linear-gradient(115deg,#063d5a 4%,#0b789f 49%,#062e54 84%);background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 7px 9px rgba(7,76,112,.12))}
.uem::selection{color:#fff;background:var(--blue)}
.brand-name{margin:25px 0 0;color:var(--muted);font-size:clamp(12px,2.5vw,14px);letter-spacing:.18em;text-transform:uppercase}
.action-area{text-align:center;padding:12px clamp(24px,7vw,54px) 50px}
.action-area h1{font-size:clamp(27px,5.5vw,38px);line-height:1.18;letter-spacing:-.8px;font-weight:450;margin:0 0 34px}
.role-bar{display:grid;grid-template-columns:1fr 1fr;width:100%;min-height:78px;border:1px solid #e8ecef;border-radius:999px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.role-choice{position:relative;border:0;background:#fff;cursor:pointer;font-size:clamp(16px,3.7vw,21px);font-weight:500;color:var(--ink);transition:background .18s,color .18s,transform .18s}.role-choice+ .role-choice{border-left:1px solid var(--line)}.role-choice:hover,.role-choice:focus-visible{background:var(--blue-soft);color:var(--blue-dark);outline:none}.role-choice:active{transform:scale(.98)}
.role-hint{margin:18px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
dialog{width:min(430px,calc(100% - 28px));border:1px solid var(--line);border-radius:26px;background:#fff;color:var(--text);padding:0;box-shadow:0 26px 80px rgba(13,35,50,.25)}
dialog::backdrop{background:rgba(12,28,39,.38);backdrop-filter:blur(4px)}
.dialog-body{padding:27px}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:23px}.dialog-head h2{margin:0 0 6px;font-size:25px;letter-spacing:-.5px}.dialog-head p{margin:0;color:var(--muted);font-size:13px}.close-button{width:39px;height:39px;border:0;border-radius:50%;background:#f2f5f7;color:var(--muted);cursor:pointer;font-size:18px}
.field{margin-bottom:14px}.field label{display:block;color:#69737c;font-size:12px;font-weight:750;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:13px;background:#f8fafb;color:var(--text);padding:13px 14px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.login-error{display:none;color:var(--danger);background:var(--danger-soft);border:1px solid rgba(199,62,72,.28);border-radius:11px;padding:10px 12px;margin:2px 0 14px;font-size:12px}.login-error.show{display:block}
.official-submit{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:13px 16px;font-weight:850;cursor:pointer}.official-submit:hover{background:var(--blue-dark)}
.transition-screen{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:#fff;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}.transition-screen.show{opacity:1;visibility:visible}.transition-content{text-align:center;padding:28px}.transition-logo{font-size:67px;line-height:1;font-weight:950;letter-spacing:-5px;color:var(--ink);animation:logoPulse 1.15s ease-in-out infinite}.transition-track{position:relative;width:190px;height:4px;margin:25px auto 23px;border-radius:99px;background:#e7edf1;overflow:hidden}.transition-track::after{content:"";position:absolute;inset:0;width:42%;border-radius:inherit;background:var(--blue);animation:trackMove 1s ease-in-out infinite}.transition-title{font-size:17px;font-weight:800;margin:0 0 6px}.transition-note{color:var(--muted);font-size:13px;margin:0}
@keyframes logoPulse{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.045);opacity:1}}@keyframes trackMove{0%{transform:translateX(-115%)}100%{transform:translateX(345%)}}
@media(max-width:520px){.hero{min-height:55vh;padding-top:17vh}.action-area{padding-bottom:max(40px,env(safe-area-inset-bottom))}.role-bar{min-height:74px}.role-hint{display:none}}
@media(max-height:680px){.hero{min-height:350px;padding-top:105px}.action-area h1{margin-bottom:24px}.role-bar{min-height:68px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.transition-logo,.transition-track::after{animation-duration:1.8s}.role-choice{transition:none}}
</style>
</head>
<body>
<main class="welcome-screen">
  <section class="hero" aria-labelledby="uemBrand">
    <span class="decor-pill" aria-hidden="true"></span><span class="decor-ring" aria-hidden="true"></span>
    <div class="greeting">
      <span class="hello-word word-one" aria-hidden="true">sawubona</span><span class="hello-word word-two" aria-hidden="true">hello</span><span class="hello-word word-three" aria-hidden="true">molo</span><span class="hello-word word-four" aria-hidden="true">dumelang</span>
      <div class="uem" id="uemBrand">UEM</div>
      <p class="brand-name">UmZumbe Enviromental Monitor</p>
    </div>
  </section>

  <section class="action-area" aria-labelledby="roleQuestion">
    <h1 id="roleQuestion">You are signing in as?</h1>
    <div class="role-bar" aria-label="Sign-in options">
      <button class="role-choice" id="residentButton" type="button">Resident</button>
      <button class="role-choice" id="officialButton" type="button">Official</button>
    </div>
    <p class="role-hint">Residents can continue without login details.</p>
  </section>
</main>

<dialog id="officialDialog" aria-labelledby="officialDialogTitle">
  <div class="dialog-body">
    <div class="dialog-head"><div><h2 id="officialDialogTitle">Official sign in</h2><p>Enter your username and PIN.</p></div><button class="close-button" id="closeDialogButton" type="button" aria-label="Close">✕</button></div>
    <form id="officialForm" novalidate>
      <div class="field"><label for="officialUsername">Username</label><input id="officialUsername" name="username" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="officialPin">PIN</label><input id="officialPin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></div>
      <div class="login-error" id="loginError" role="alert">Incorrect username or PIN. Please try again.</div>
      <button class="official-submit" type="submit">Continue</button>
    </form>
  </div>
</dialog>

<div class="transition-screen" id="transitionScreen" role="status" aria-live="polite" aria-hidden="true">
  <div class="transition-content"><div class="transition-logo">UEM</div><div class="transition-track" aria-hidden="true"></div><p class="transition-title">Taking you there in a moment…</p><p class="transition-note">Hang tight.</p></div>
</div>

<script>
const residentButton=document.getElementById("residentButton"),officialButton=document.getElementById("officialButton"),officialDialog=document.getElementById("officialDialog"),closeDialogButton=document.getElementById("closeDialogButton"),officialForm=document.getElementById("officialForm"),officialUsername=document.getElementById("officialUsername"),officialPin=document.getElementById("officialPin"),loginError=document.getElementById("loginError"),transitionScreen=document.getElementById("transitionScreen");
let leaving=false;
function goTo(destination){if(leaving)return;leaving=true;if(officialDialog.open)officialDialog.close();transitionScreen.classList.add("show");transitionScreen.setAttribute("aria-hidden","false");const delay=matchMedia("(prefers-reduced-motion: reduce)").matches?650:1650;setTimeout(()=>{location.href=destination},delay)}
residentButton.addEventListener("click",()=>goTo("dashboard.html"));
officialButton.addEventListener("click",()=>{loginError.classList.remove("show");officialForm.reset();officialDialog.showModal();setTimeout(()=>officialUsername.focus(),80)});
closeDialogButton.addEventListener("click",()=>officialDialog.close());
officialDialog.addEventListener("click",event=>{if(event.target===officialDialog)officialDialog.close()});
officialForm.addEventListener("submit",event=>{event.preventDefault();const username=officialUsername.value.trim().toLowerCase(),pin=officialPin.value;if(username==="owner"&&pin==="0000"){sessionStorage.setItem("uem-official-auth","true");goTo("official.html");return}loginError.classList.add("show");officialPin.value="";officialPin.focus()});
[officialUsername,officialPin].forEach(input=>input.addEventListener("input",()=>loginError.classList.remove("show")));
</script>
</body>
</html>
