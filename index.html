<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        uMzumbe Environmental Monitor
    </title>


    <style>

        body
        {
            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 25px;

            text-align: center;
        }


        .card
        {
            max-width: 520px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);
        }


        h1
        {
            margin-top: 5px;

            font-size: 27px;
        }


        .subtitle
        {
            color: #666;
        }


        #sensorValue
        {
            font-size: 65px;

            font-weight: bold;

            margin-top: 25px;

            margin-bottom: 5px;
        }


        #status
        {
            font-size: 25px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        /* BAR BACKGROUND */

        .bar-container
        {
            width: 100%;

            height: 30px;

            background: #ddd;

            border-radius: 15px;

            overflow: hidden;

            margin-top: 20px;

            margin-bottom: 25px;
        }


        /* MOVING BAR */

        #sensorBar
        {
            height: 100%;

            width: 0%;

            background: gray;

            transition:
                width 0.2s,
                background 0.2s;
        }


        button
        {
            padding: 14px 25px;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #222;

            color: white;

            margin-top: 15px;
        }


        button:hover
        {
            opacity: 0.85;
        }


        #connectionStatus
        {
            margin-top: 15px;

            font-weight: bold;
        }


        #alertMessage
        {
            margin-top: 25px;

            padding: 15px;

            border-radius: 8px;

            background: #eeeeee;

            font-weight: bold;
        }


        .small-text
        {
            color: #777;

            font-size: 13px;

            margin-top: 30px;
        }

    </style>

</head>


<body>


<div class="card">


    <h1>
        uMzumbe Environmental Monitor
    </h1>


    <p class="subtitle">
        Live Environmental Sensor Prototype
    </p>


    <div id="sensorValue">
        ---
    </div>


    <div id="status">
        Waiting for data...
    </div>


    <div class="bar-container">

        <div id="sensorBar"></div>

    </div>


    <div id="alertMessage">

        Waiting for sensor information...

    </div>


    <hr style="margin-top: 30px;">


    <button id="connectButton">

        Connect Arduino

    </button>


    <div id="connectionStatus">

        Arduino not connected to this device

    </div>


    <div class="small-text">

        Live prototype data synchronized through Firebase

    </div>


</div>



<script type="module">


// ======================================================
// FIREBASE LIBRARIES
// ======================================================

import
{
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import
{
    getDatabase,
    ref,
    set,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



// ======================================================
// YOUR FIREBASE CONFIGURATION
// ======================================================
//
// IMPORTANT:
//
// Replace everything below with the SAME Firebase
// configuration that was working in your old webpage.
//
// ======================================================

const firebaseConfig =
    {

        apiKey:
        "AIzaSyDEklrPBaRIvDg8bTwkcMz3kE_VNLcVxAs",

        authDomain:
        "umzumbe-monitor.firebaseapp.com",

        databaseURL:
        "https://umzumbe-monitor-default-rtdb.firebaseio.com",

        projectId:
        "umzumbe-monitor",

        storageBucket:
        "umzumbe-monitor.firebasestorage.app",

        messagingSenderId:
        "781346294395",

        appId:
        "1:781346294395:web:056f025c31ab1b055f70de"

    };



// ======================================================
// START FIREBASE
// ======================================================

const app =
    initializeApp(
        firebaseConfig
    );


const database =
    getDatabase(
        app
    );



// This is where the sensor reading is stored

const sensorReference =
    ref(
        database,
        "sensor/currentValue"
    );



// ======================================================
// HTML ELEMENTS
// ======================================================

const sensorValueDisplay =
    document.getElementById(
        "sensorValue"
    );


const statusDisplay =
    document.getElementById(
        "status"
    );


const sensorBar =
    document.getElementById(
        "sensorBar"
    );


const alertMessage =
    document.getElementById(
        "alertMessage"
    );


const connectButton =
    document.getElementById(
        "connectButton"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );



// ======================================================
// FIREBASE LIVE LISTENER
// ======================================================
//
// EVERY DEVICE running this page listens here.
//
// If Firebase receives:
//
//          700
//
// every connected phone/laptop/tablet receives:
//
//          700
//
// ======================================================

onValue(
    sensorReference,

    function(snapshot)
    {

        const value =
            snapshot.val();


        if (value === null)
        {
            return;
        }


        updateDisplay(
            value
        );

    }
);



// ======================================================
// UPDATE SCREEN
// ======================================================

function updateDisplay(value)
{

    sensorValueDisplay.innerText =
        value;


    // Convert 0-1023 into percentage

    const percentage =
        (
            value
            /
            1023
        )
        *
        100;


    sensorBar.style.width =
        percentage + "%";


    // --------------------------------------------------
    // LOW
    // --------------------------------------------------

    if (value < 300)
    {

        statusDisplay.innerText =
            "Status: LOW";


        statusDisplay.style.color =
            "green";


        sensorBar.style.background =
            "green";


        alertMessage.innerText =
            "Environmental conditions normal";


        alertMessage.style.background =
            "#dff5df";

    }


    // --------------------------------------------------
    // MODERATE
    // --------------------------------------------------

    else if (value < 700)
    {

        statusDisplay.innerText =
            "Status: MODERATE";


        statusDisplay.style.color =
            "#b58200";


        sensorBar.style.background =
            "#d6a000";


        alertMessage.innerText =
            "Environmental conditions are increasing";


        alertMessage.style.background =
            "#fff1c2";

    }


    // --------------------------------------------------
    // HIGH
    // --------------------------------------------------

    else
    {

        statusDisplay.innerText =
            "Status: HIGH";


        statusDisplay.style.color =
            "red";


        sensorBar.style.background =
            "red";


        alertMessage.innerText =
            "WARNING: HIGH SENSOR LEVEL DETECTED";


        alertMessage.style.background =
            "#ffd6d6";

    }

}



// ======================================================
// SERIAL VARIABLES
// ======================================================

let port;

let reader;

let keepReading =
    false;


let serialBuffer =
    "";



// ======================================================
// CHECK WHETHER BROWSER SUPPORTS WEB SERIAL
// ======================================================

if (!("serial" in navigator))
{

    connectButton.disabled =
        true;


    connectButton.innerText =
        "Arduino Connection Not Supported";


    connectionStatus.innerText =
        "This browser can view live data, but cannot connect directly to the Arduino.";

}



// ======================================================
// CONNECT BUTTON
// ======================================================

connectButton.addEventListener(
    "click",

    async function()
    {

        // If already connected, disconnect instead

        if (keepReading)
        {

            await disconnectArduino();

            return;

        }


        try
        {

            // ------------------------------------------
            // ASK USER WHICH SERIAL DEVICE TO USE
            // ------------------------------------------

            port =
                await navigator.serial.requestPort();


            // ------------------------------------------
            // OPEN SERIAL CONNECTION
            // ------------------------------------------
            //
            // MUST MATCH:
            //
            // Serial.begin(9600);
            //
            // ------------------------------------------

            await port.open(
                {
                    baudRate: 9600
                }
            );


            connectionStatus.innerText =
                "Arduino connected";


            connectionStatus.style.color =
                "green";


            connectButton.innerText =
                "Disconnect Arduino";


            keepReading =
                true;


            // Arduino UNO may restart after connection.
            // Give it two seconds.

            await sleep(
                2000
            );


            // Start receiving values

            readSerialData();

        }


        catch(error)
        {

            console.error(
                error
            );


            connectionStatus.innerText =
                "Arduino connection failed";


            connectionStatus.style.color =
                "red";

        }

    }
);



// ======================================================
// READ ARDUINO
// ======================================================

async function readSerialData()
{

    const decoder =
        new TextDecoder();


    while (
        port &&
        port.readable &&
        keepReading
    )
    {

        reader =
            port.readable.getReader();


        try
        {

            while (keepReading)
            {

                const
                {
                    value,
                    done
                }
                =
                await reader.read();


                if (done)
                {
                    break;
                }


                if (value)
                {

                    // Convert raw bytes into text

                    serialBuffer +=
                        decoder.decode(
                            value,
                            {
                                stream: true
                            }
                        );


                    // Arduino sends each number with
                    // Serial.println()
                    //
                    // Therefore each reading ends
                    // with a new line.

                    const lines =
                        serialBuffer.split(
                            /\r?\n/
                        );


                    // Last piece may not yet contain
                    // a complete line.

                    serialBuffer =
                        lines.pop();


                    // Process completed lines

                    for (
                        const line of lines
                    )
                    {

                        const cleanLine =
                            line.trim();


                        if (
                            cleanLine === ""
                        )
                        {
                            continue;
                        }


                        const sensorValue =
                            Number(
                                cleanLine
                            );


                        // Make sure Arduino sent
                        // a valid number.

                        if (
                            !Number.isInteger(
                                sensorValue
                            )
                        )
                        {
                            continue;
                        }


                        if (
                            sensorValue < 0 ||
                            sensorValue > 1023
                        )
                        {
                            continue;
                        }


                        // ==================================
                        // SEND ARDUINO VALUE TO FIREBASE
                        // ==================================

                        await set(
                            sensorReference,
                            sensorValue
                        );


                        console.log(
                            "Arduino:",
                            sensorValue
                        );

                    }

                }

            }

        }


        catch(error)
        {

            console.error(
                "Serial reading error:",
                error
            );

        }


        finally
        {

            reader.releaseLock();

        }

    }

}



// ======================================================
// DISCONNECT ARDUINO
// ======================================================

async function disconnectArduino()
{

    keepReading =
        false;


    if (reader)
    {

        try
        {

            await reader.cancel();

        }

        catch(error)
        {

            console.log(
                error
            );

        }

    }


    if (port)
    {

        try
        {

            await port.close();

        }

        catch(error)
        {

            console.log(
                error
            );

        }

    }


    port =
        null;


    reader =
        null;


    connectButton.innerText =
        "Connect Arduino";


    connectionStatus.innerText =
        "Arduino disconnected";


    connectionStatus.style.color =
        "#555";

}



// ======================================================
// SIMPLE WAIT FUNCTION
// ======================================================

function sleep(milliseconds)
{

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );

}


</script>


</body>

</html>
